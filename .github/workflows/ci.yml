name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m signalroom.training
      - run: ruff check .
      - run: pytest --cov=signalroom --cov-fail-under=85
      - run: node --check app.js
      - run: docker compose config -q

