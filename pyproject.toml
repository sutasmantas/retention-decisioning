[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalroom-retention"
version = "1.0.0"
description = "Reproducible churn scoring and capacity-aware retention decisioning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["signalroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["signalroom"]

