[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalroom-retention"
version = "2.0.0"
description = "Value-aware retention decisioning with uplift modeling and capacity-constrained policy simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mantas Sutas" }]
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["signalroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["signalroom"]
